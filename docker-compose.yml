version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: movemate-postgres
    environment:
      POSTGRES_USER: movemate
      POSTGRES_PASSWORD: movemate-dev-password
      POSTGRES_DB: movemate
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U movemate']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movemate-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
